openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: The signed-in user
  - name: staff
    description: Staff members and roles
  - name: programs
    description: Grant programs
  - name: profile
    description: The signed-in applicant's profile
  - name: applicants
    description: Applicant directory and account controls (staff)
  - name: applications
    description: Grant applications and review
security:
  - bearerAuth: []
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      security: []
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /me:
    get:
      operationId: getMe
      tags: [auth]
      summary: Current user
      description: The signed-in user, and their staff record if they are staff. Links a staff record to this user on first sign-in with a confirmed email.
      responses:
        "200":
          description: Signed-in user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /staff:
    get:
      operationId: listStaff
      tags: [staff]
      summary: List staff members
      description: Requires the staff.manage permission.
      responses:
        "200":
          description: Staff members
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/StaffMember"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      operationId: createStaffMember
      tags: [staff]
      summary: Add a staff member
      description: Requires the staff.manage permission. The person gets access when they sign in with this email and have confirmed it.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StaffMemberCreate"
      responses:
        "201":
          description: Created staff member
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StaffMember"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: A staff member with this email already exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /staff/{id}:
    patch:
      operationId: updateStaffMember
      tags: [staff]
      summary: Change a staff member's role or access
      description: Requires the staff.manage permission. At least one active super admin must remain, and nobody can disable their own access.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StaffMemberUpdate"
      responses:
        "200":
          description: Updated staff member
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StaffMember"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /programs:
    get:
      operationId: listPrograms
      tags: [programs]
      summary: List grant programs
      description: Active staff see every program, drafts included. Everyone else sees open and closed programs only.
      responses:
        "200":
          description: Programs, oldest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Program"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      operationId: createProgram
      tags: [programs]
      summary: Create a draft program
      description: Requires the programs.manage permission. New programs start as drafts, visible to staff only.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProgramInput"
      responses:
        "201":
          description: Created program
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProgramResult"
        "400":
          $ref: "#/components/responses/Invalid"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /programs/{id}:
    parameters:
      - $ref: "#/components/parameters/ProgramId"
    put:
      operationId: updateProgram
      tags: [programs]
      summary: Edit a program
      description: Requires the programs.manage permission. Fails with 409 if the program changed after `version` was read.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProgramUpdate"
      responses:
        "200":
          description: Saved program
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProgramResult"
        "400":
          $ref: "#/components/responses/Invalid"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Stale"
  /programs/{id}/delete:
    parameters:
      - $ref: "#/components/parameters/ProgramId"
    post:
      operationId: deleteProgram
      tags: [programs]
      summary: Delete an unused draft
      description: Requires the programs.manage permission. Only drafts without applications can be deleted; published programs are closed instead.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProgramVersion"
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
        "400":
          $ref: "#/components/responses/Invalid"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Stale"
  /programs/{id}/publish:
    parameters:
      - $ref: "#/components/parameters/ProgramId"
    post:
      operationId: publishProgram
      tags: [programs]
      summary: Publish a draft or reopen a closed program
      description: Requires the programs.manage permission. The program must be valid with a deadline today or later.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProgramVersion"
      responses:
        "200":
          description: Open program
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProgramResult"
        "400":
          $ref: "#/components/responses/Invalid"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Stale"
  /programs/{id}/close:
    parameters:
      - $ref: "#/components/parameters/ProgramId"
    post:
      operationId: closeProgram
      tags: [programs]
      summary: Close a program to new applications
      description: Requires the programs.manage permission. Applications already submitted continue through review.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProgramVersion"
      responses:
        "200":
          description: Closed program
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProgramResult"
        "400":
          $ref: "#/components/responses/Invalid"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Stale"
  /profile:
    get:
      operationId: getProfile
      tags: [profile]
      summary: The signed-in person's applicant profile
      description: Created on first request from the details given at sign-up. The email always matches the sign-in account.
      responses:
        "200":
          description: Profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Profile"
        "401":
          $ref: "#/components/responses/Unauthorized"
    patch:
      operationId: updateProfile
      tags: [profile]
      summary: Edit your name, phone, and address
      description: The email is the sign-in account's; tier and identity status are set by staff.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProfileUpdate"
      responses:
        "200":
          description: Saved profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Profile"
        "400":
          $ref: "#/components/responses/Invalid"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /profile/identity:
    post:
      operationId: submitIdentityCheck
      tags: [profile]
      summary: Submit your identity details
      description: Only the last four characters of the document number are kept. Compliance reviews the check.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IdentitySubmission"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Profile"
        "400":
          $ref: "#/components/responses/Invalid"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Stale"
  /profile/credential-reset:
    post:
      operationId: completeCredentialReset
      tags: [profile]
      summary: Confirm a reset the grant team asked for
      description: Records that you chose a new password or set up two-step sign-in again.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CredentialReset"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Profile"
        "400":
          $ref: "#/components/responses/Invalid"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Stale"
  /applicants:
    get:
      operationId: listApplicants
      tags: [applicants]
      summary: Applicant directory
      description: Any active staff member. Newest first.
      responses:
        "200":
          description: Applicants
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ApplicantEntry"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /applicants/{id}/tier:
    parameters:
      - $ref: "#/components/parameters/ApplicantId"
    post:
      operationId: setApplicantTier
      tags: [applicants]
      summary: Change an applicant's tier
      description: Requires accounts.tier. A reason is required; the applicant is told.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TierChange"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApplicantResult"
        "400":
          $ref: "#/components/responses/Invalid"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Stale"
  /applicants/{id}/lock:
    parameters:
      - $ref: "#/components/parameters/ApplicantId"
    post:
      operationId: lockApplicant
      tags: [applicants]
      summary: Lock an account
      description: Requires accounts.manage. Blocks applications and money actions until unlocked.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Reason"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApplicantResult"
        "400":
          $ref: "#/components/responses/Invalid"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Stale"
  /applicants/{id}/unlock:
    parameters:
      - $ref: "#/components/parameters/ApplicantId"
    post:
      operationId: unlockApplicant
      tags: [applicants]
      summary: Unlock an account
      description: Requires accounts.manage.
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApplicantResult"
        "400":
          $ref: "#/components/responses/Invalid"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Stale"
  /applicants/{id}/credential-reset:
    parameters:
      - $ref: "#/components/parameters/ApplicantId"
    post:
      operationId: requireCredentialReset
      tags: [applicants]
      summary: Require a new password or two-step setup
      description: Requires accounts.manage. Recorded for the applicant to complete.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CredentialReset"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApplicantResult"
        "400":
          $ref: "#/components/responses/Invalid"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Stale"
  /applicants/{id}/identity/approve:
    parameters:
      - $ref: "#/components/parameters/ApplicantId"
    post:
      operationId: approveIdentityCheck
      tags: [applicants]
      summary: Approve an identity check
      description: Requires kyc.review.
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApplicantResult"
        "400":
          $ref: "#/components/responses/Invalid"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Stale"
  /applicants/{id}/identity/reject:
    parameters:
      - $ref: "#/components/parameters/ApplicantId"
    post:
      operationId: rejectIdentityCheck
      tags: [applicants]
      summary: Reject an identity check
      description: Requires kyc.review. The reason is shown to the applicant.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Reason"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApplicantResult"
        "400":
          $ref: "#/components/responses/Invalid"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Stale"
  /applicants/{id}/identity/reverify:
    parameters:
      - $ref: "#/components/parameters/ApplicantId"
    post:
      operationId: requestReverification
      tags: [applicants]
      summary: Ask a verified applicant to verify again
      description: Requires kyc.review. The reason is shown to the applicant.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Reason"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApplicantResult"
        "400":
          $ref: "#/components/responses/Invalid"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Stale"
  /applications/mine:
    get:
      operationId: listMyApplications
      tags: [applications]
      summary: Your applications
      description: The signed-in applicant's own applications, drafts included. Staff-only fields (reviewer, internal notes, escalation) are left out.
      responses:
        "200":
          description: Applications
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Application"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /applications:
    get:
      operationId: listApplications
      tags: [applications]
      summary: Review queue
      description: Any active staff member. Every application except drafts, with internal notes and escalations.
      responses:
        "200":
          description: Applications
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Application"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /applications/save:
    post:
      operationId: saveApplicationDraft
      tags: [applications]
      summary: Save a draft
      description: Creates or updates your draft for a program (or your application while changes are requested).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApplicationSubmission"
      responses:
        "200":
          description: Done
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApplicationResult"
        "400":
          $ref: "#/components/responses/Invalid"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /applications/submit:
    post:
      operationId: submitApplication
      tags: [applications]
      summary: Submit or resubmit
      description: Validates, re-checks eligibility, and submits. Resubmits an application that has changes requested.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApplicationSubmission"
      responses:
        "200":
          description: Done
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApplicationResult"
        "400":
          $ref: "#/components/responses/Invalid"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /applications/{id}/delete:
    parameters:
      - $ref: "#/components/parameters/ApplicationId"
    post:
      operationId: deleteApplicationDraft
      tags: [applications]
      summary: Delete your draft
      description: Only drafts can be deleted.
      responses:
        "200":
          description: Done
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
        "400":
          $ref: "#/components/responses/Invalid"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /applications/{id}/start-review:
    parameters:
      - $ref: "#/components/parameters/ApplicationId"
    post:
      operationId: startReview
      tags: [applications]
      summary: Start review
      description: Requires applications.review. Submitted → Under review, assigned to you.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApplicationVersion"
      responses:
        "200":
          description: Done
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApplicationResult"
        "400":
          $ref: "#/components/responses/Invalid"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Stale"
  /applications/{id}/approve:
    parameters:
      - $ref: "#/components/parameters/ApplicationId"
    post:
      operationId: approveApplication
      tags: [applications]
      summary: Approve with an award
      description: Requires applications.review. The award can't exceed the request, the program ceiling, or what's left of the budget; escalated applications can't be approved.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AwardDecision"
      responses:
        "200":
          description: Done
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApplicationResult"
        "400":
          $ref: "#/components/responses/Invalid"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Stale"
  /applications/{id}/request-changes:
    parameters:
      - $ref: "#/components/parameters/ApplicationId"
    post:
      operationId: requestApplicationChanges
      tags: [applications]
      summary: Request changes
      description: Requires applications.review. The message is shown to the applicant, who can edit and resubmit.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangeRequest"
      responses:
        "200":
          description: Done
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApplicationResult"
        "400":
          $ref: "#/components/responses/Invalid"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Stale"
  /applications/{id}/decline:
    parameters:
      - $ref: "#/components/parameters/ApplicationId"
    post:
      operationId: declineApplication
      tags: [applications]
      summary: Decline
      description: Requires applications.review. The reason is shown to the applicant.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeclineDecision"
      responses:
        "200":
          description: Done
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApplicationResult"
        "400":
          $ref: "#/components/responses/Invalid"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Stale"
  /applications/{id}/notes:
    parameters:
      - $ref: "#/components/parameters/ApplicationId"
    post:
      operationId: addInternalNote
      tags: [applications]
      summary: Add an internal note
      description: Requires notes.add. Staff-only; doesn't change the record version.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InternalNoteInput"
      responses:
        "200":
          description: Done
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApplicationResult"
        "400":
          $ref: "#/components/responses/Invalid"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /applications/{id}/escalate:
    parameters:
      - $ref: "#/components/parameters/ApplicationId"
    post:
      operationId: escalateApplication
      tags: [applications]
      summary: Escalate to security
      description: Requires applications.escalate. Staff-only; blocks approval until cleared.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Reason"
      responses:
        "200":
          description: Done
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApplicationResult"
        "400":
          $ref: "#/components/responses/Invalid"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /applications/{id}/clear-escalation:
    parameters:
      - $ref: "#/components/parameters/ApplicationId"
    post:
      operationId: clearEscalation
      tags: [applications]
      summary: Clear an escalation
      description: Requires applications.clearEscalation.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EscalationResolution"
      responses:
        "200":
          description: Done
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApplicationResult"
        "400":
          $ref: "#/components/responses/Invalid"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Supabase Auth access token
  parameters:
    ApplicationId:
      name: id
      in: path
      required: true
      schema:
        type: string
        pattern: "^[A-Za-z0-9-]{1,40}$"
    ApplicantId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ProgramId:
      name: id
      in: path
      required: true
      schema:
        type: string
        pattern: "^[A-Za-z0-9-]{1,40}$"
  responses:
    Invalid:
      description: The change was refused; `fieldErrors` names the fields to fix
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ValidationError"
    Stale:
      description: The record changed since it was read; reload it and try again
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    BadRequest:
      description: The request was not valid
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthorized:
      description: Missing, invalid, or expired sign-in token
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Forbidden:
      description: Signed in, but not allowed to do this
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: Not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  schemas:
    ApplicationStatus:
      type: string
      enum: [Draft, Submitted, Under review, Changes requested, Approved, Declined]
    ApplicationInput:
      type: object
      properties:
        businessName:
          type: string
          maxLength: 200
        requestedAmount:
          type: number
        registrationNumber:
          type: string
          maxLength: 80
        purpose:
          type: string
          maxLength: 5000
        checklist:
          type: array
          maxItems: 20
          items:
            type: string
            maxLength: 200
        answers:
          type: object
          maxProperties: 20
          additionalProperties:
            type: string
            maxLength: 1000
      required: [businessName, requestedAmount, registrationNumber, purpose, checklist, answers]
      additionalProperties: false
    ApplicationSubmission:
      type: object
      properties:
        grantId:
          type: string
          maxLength: 40
        draftId:
          type: string
          maxLength: 40
          description: Your existing draft (or application with changes requested), if any
        application:
          $ref: "#/components/schemas/ApplicationInput"
      required: [grantId, application]
      additionalProperties: false
    ApplicationEvent:
      type: object
      properties:
        status:
          $ref: "#/components/schemas/ApplicationStatus"
        at:
          type: string
        actor:
          type: string
          enum: [Applicant, Reviewer]
        note:
          type: string
      required: [status, at, actor, note]
    InternalNote:
      type: object
      properties:
        at:
          type: string
        author:
          type: string
        text:
          type: string
      required: [at, author, text]
    Escalation:
      type: object
      properties:
        at:
          type: string
        by:
          type: string
        reason:
          type: string
        status:
          type: string
          enum: [Open, Cleared]
        clearedAt:
          type: string
        clearedBy:
          type: string
        resolution:
          type: string
      required: [at, by, reason, status]
    Application:
      type: object
      properties:
        id:
          type: string
        applicantId:
          type: string
        grantId:
          type: string
        status:
          $ref: "#/components/schemas/ApplicationStatus"
        businessName:
          type: string
        requestedAmount:
          type: number
        registrationNumber:
          type: string
        purpose:
          type: string
        checklist:
          type: array
          items:
            type: string
        answers:
          type: object
          additionalProperties:
            type: string
        createdAt:
          type: string
        updatedAt:
          type: string
          description: Record version; send it back with review decisions
        submittedAt:
          type: string
          nullable: true
        reviewer:
          type: string
          nullable: true
        awardedAmount:
          type: number
          nullable: true
        history:
          type: array
          items:
            $ref: "#/components/schemas/ApplicationEvent"
        internalNotes:
          type: array
          items:
            $ref: "#/components/schemas/InternalNote"
        escalation:
          allOf:
            - $ref: "#/components/schemas/Escalation"
          nullable: true
      required: [id, applicantId, grantId, status, businessName, requestedAmount, registrationNumber, purpose, checklist, answers, createdAt, updatedAt, submittedAt, reviewer, awardedAmount, history, internalNotes, escalation]
    ApplicationResult:
      type: object
      properties:
        application:
          $ref: "#/components/schemas/Application"
        message:
          type: string
      required: [application, message]
    ApplicationVersion:
      type: object
      properties:
        version:
          type: string
          maxLength: 40
      required: [version]
      additionalProperties: false
    AwardDecision:
      type: object
      properties:
        version:
          type: string
          maxLength: 40
        award:
          type: number
      required: [version, award]
      additionalProperties: false
    ChangeRequest:
      type: object
      properties:
        version:
          type: string
          maxLength: 40
        message:
          type: string
          maxLength: 2000
      required: [version, message]
      additionalProperties: false
    DeclineDecision:
      type: object
      properties:
        version:
          type: string
          maxLength: 40
        reason:
          type: string
          maxLength: 2000
      required: [version, reason]
      additionalProperties: false
    InternalNoteInput:
      type: object
      properties:
        text:
          type: string
          maxLength: 2000
      required: [text]
      additionalProperties: false
    EscalationResolution:
      type: object
      properties:
        resolution:
          type: string
          maxLength: 2000
      required: [resolution]
      additionalProperties: false
    ValidationError:
      type: object
      properties:
        error:
          type: string
        fieldErrors:
          type: object
          additionalProperties:
            type: string
      required: [error]
    Message:
      type: object
      properties:
        message:
          type: string
      required: [message]
    ProgramStatus:
      type: string
      enum: [Draft, Open, Closed]
    ProgramQuestion:
      type: object
      properties:
        id:
          type: string
          maxLength: 40
          description: Empty for a new question; the server derives one from the label
        label:
          type: string
          maxLength: 200
        type:
          type: string
          enum: [text, number, yesno]
        required:
          type: boolean
      required: [id, label, type, required]
      additionalProperties: false
    ProgramChange:
      type: object
      properties:
        at:
          type: string
        by:
          type: string
        summary:
          type: string
      required: [at, by, summary]
    ProgramInput:
      type: object
      properties:
        name:
          type: string
          maxLength: 200
        summary:
          type: string
          maxLength: 1000
        focus:
          type: string
          maxLength: 200
        maxFunding:
          type: number
        minimumRequest:
          type: number
        budget:
          type: number
        deadline:
          type: string
          maxLength: 10
          description: ISO date (YYYY-MM-DD)
        minimumTier:
          type: integer
          enum: [1, 2, 3]
        requirements:
          type: array
          maxItems: 20
          items:
            type: string
            maxLength: 200
        requiresRegistration:
          type: boolean
        questions:
          type: array
          maxItems: 20
          items:
            $ref: "#/components/schemas/ProgramQuestion"
      required: [name, summary, focus, maxFunding, minimumRequest, budget, deadline, minimumTier, requirements, requiresRegistration, questions]
      additionalProperties: false
    Program:
      allOf:
        - $ref: "#/components/schemas/ProgramInput"
        - type: object
          properties:
            id:
              type: string
            status:
              $ref: "#/components/schemas/ProgramStatus"
            updatedAt:
              type: string
              description: Record version; send it back with changes
            changeLog:
              type: array
              items:
                $ref: "#/components/schemas/ProgramChange"
          required: [id, status, updatedAt, changeLog]
    ProgramResult:
      type: object
      properties:
        program:
          $ref: "#/components/schemas/Program"
        message:
          type: string
      required: [program, message]
    ProgramVersion:
      type: object
      properties:
        version:
          type: string
          maxLength: 40
      required: [version]
      additionalProperties: false
    ProgramUpdate:
      type: object
      properties:
        version:
          type: string
          maxLength: 40
        program:
          $ref: "#/components/schemas/ProgramInput"
      required: [version, program]
      additionalProperties: false
    Profile:
      type: object
      properties:
        name:
          type: string
        email:
          type: string
        phone:
          type: string
        address:
          type: string
        sector:
          type: string
        country:
          type: string
        tier:
          type: integer
          enum: [1, 2, 3]
        identityVerified:
          type: boolean
        joined:
          type: string
          description: ISO date the profile was created
        account:
          $ref: "#/components/schemas/Account"
      required: [name, email, phone, address, sector, country, tier, identityVerified, joined, account]
    Kyc:
      type: object
      properties:
        status:
          type: string
          enum: [Not submitted, Pending, Verified, Rejected]
        documentType:
          type: string
          enum: [Passport, National ID, Driver's licence]
        documentLast4:
          type: string
        nameOnDocument:
          type: string
        submittedAt:
          type: string
        reviewedAt:
          type: string
        reviewedBy:
          type: string
        rejectionReason:
          type: string
      required: [status]
    Account:
      type: object
      description: Staff-managed controls on an applicant account
      properties:
        status:
          type: string
          enum: [Active, Locked]
        lockReason:
          type: string
        lockedAt:
          type: string
        lockedBy:
          type: string
        passwordResetRequired:
          type: boolean
        twoFactorResetRequired:
          type: boolean
        kyc:
          $ref: "#/components/schemas/Kyc"
      required: [status, passwordResetRequired, twoFactorResetRequired, kyc]
    ApplicantEntry:
      type: object
      properties:
        id:
          type: string
          format: uuid
        profile:
          $ref: "#/components/schemas/Profile"
      required: [id, profile]
    ApplicantResult:
      type: object
      properties:
        applicant:
          $ref: "#/components/schemas/ApplicantEntry"
        message:
          type: string
      required: [applicant, message]
    Reason:
      type: object
      properties:
        reason:
          type: string
          maxLength: 1000
      required: [reason]
      additionalProperties: false
    TierChange:
      type: object
      properties:
        tier:
          type: integer
          enum: [1, 2, 3]
        reason:
          type: string
          maxLength: 1000
      required: [tier, reason]
      additionalProperties: false
    CredentialReset:
      type: object
      properties:
        kind:
          type: string
          enum: [password, twoFactor]
      required: [kind]
      additionalProperties: false
    IdentitySubmission:
      type: object
      properties:
        documentType:
          type: string
          enum: [Passport, National ID, Driver's licence]
        documentNumber:
          type: string
          maxLength: 40
        nameOnDocument:
          type: string
          maxLength: 120
      required: [documentType, documentNumber, nameOnDocument]
      additionalProperties: false
    ProfileUpdate:
      type: object
      properties:
        name:
          type: string
          maxLength: 120
        phone:
          type: string
          maxLength: 40
        address:
          type: string
          maxLength: 300
      required: [name, phone, address]
      additionalProperties: false
    Error:
      type: object
      properties:
        error:
          type: string
      required:
        - error
    StaffRole:
      type: string
      enum: [super, reviewer, finance, compliance, support]
    StaffMember:
      type: object
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
        name:
          type: string
        role:
          $ref: "#/components/schemas/StaffRole"
        active:
          type: boolean
        linked:
          type: boolean
          description: Whether this member has signed in at least once
      required: [id, email, name, role, active, linked]
    StaffMemberCreate:
      type: object
      properties:
        email:
          type: string
          format: email
        name:
          type: string
          minLength: 2
          maxLength: 80
        role:
          $ref: "#/components/schemas/StaffRole"
      required: [email, name, role]
      additionalProperties: false
    StaffMemberUpdate:
      type: object
      properties:
        role:
          $ref: "#/components/schemas/StaffRole"
        active:
          type: boolean
      additionalProperties: false
    Me:
      type: object
      properties:
        user:
          type: object
          properties:
            id:
              type: string
            email:
              type: string
              nullable: true
            emailConfirmed:
              type: boolean
          required: [id, email, emailConfirmed]
        staff:
          allOf:
            - $ref: "#/components/schemas/StaffMember"
          nullable: true
        permissions:
          type: array
          items:
            type: string
          description: Staff permissions for this user (empty for applicants)
      required: [user, staff, permissions]
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

