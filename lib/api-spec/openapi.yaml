        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Branding"
        "400":
          $ref: "#/components/responses/Invalid"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "413":
          $ref: "#/components/responses/Invalid"
        "415":
          $ref: "#/components/responses/Invalid"
  /branding/logo-dark/delete:
    post:
      operationId: removeBrandLogoDark
      tags: [email]
      summary: Remove the logo for dark backgrounds (super admin)
      description: Goes back to the default. Audited.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Branding"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /branding/favicon:
    get:
      operationId: getBrandFavicon
      tags: [email]
      security: []
      summary: The uploaded favicon (public)
      description: Public, so pages and email clients can show it. Checked against the SHA-256 recorded at upload.
      responses:
        "200":
          description: The image
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      operationId: uploadBrandFavicon
      tags: [email]
      summary: Upload the favicon (super admin)
      description: The raw image is the body (PNG, JPEG, or WEBP, detected from the content; at most 1 MB). Stored on the API server's disk; replaces the previous one. Audited.
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Branding"
        "400":
          $ref: "#/components/responses/Invalid"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "413":
          $ref: "#/components/responses/Invalid"
