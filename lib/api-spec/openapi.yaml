      tags: [documents]
      summary: An applicant's or application's documents (staff)
      description: Any active staff member; only the kinds of document the role may open are listed (identity needs kyc.review; application evidence needs applications.review, applications.clearEscalation, or kyc.review).
      parameters:
        - name: applicantId
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - name: applicationId
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Document"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      operationId: uploadDocument
      tags: [documents]
      summary: Upload a document
      description: The raw file is the request body (at most 10 MB; PDF, JPEG, or PNG, detected from the content). Put the URI-encoded file name in the X-File-Name header. Application evidence must name a saved application of yours that is a draft or has changes requested, and one of its program's requirements, or one of its form's file fields as field:<field id>. Identity documents can't change while a check is pending or verified.
      parameters:
        - name: purpose
          in: query
          required: true
          schema:
            $ref: "#/components/schemas/DocumentPurpose"
        - name: applicationId
          in: query
          required: false
          schema:
            type: string
        - name: requirement
          in: query
          required: false
          schema:
            type: string
        - name: X-File-Name
          in: header
          required: false
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
      responses:
        "201":
          description: Stored
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Document"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Stale"
        "413":
          $ref: "#/components/responses/BadRequest"
        "415":
          $ref: "#/components/responses/BadRequest"
  /documents/{id}/delete:
    parameters:
      - $ref: "#/components/parameters/DocumentId"
    post:
      operationId: deleteDocument
      tags: [documents]
      summary: Delete one of your documents
      description: Removes the file and keeps the record, marked deleted. Refused while the evidence is under review or on record.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Stale"
  /documents/{id}/file:
    parameters:
      - $ref: "#/components/parameters/DocumentId"
    get:
      operationId: getDocumentFile
      tags: [documents]
      summary: Download a document
      description: The owner, or staff whose role covers the document (each staff view is audited). The content is checked against the SHA-256 recorded at upload; a changed or missing file answers 500.
      responses:
        "200":
          description: The file
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /profile/email-preference:
    get:
      operationId: getEmailPreference
      tags: [email]
      summary: Whether your notifications are also emailed
      description: On by default.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmailPreference"
        "401":
          $ref: "#/components/responses/Unauthorized"
    put:
      operationId: setEmailPreference
      tags: [email]
      summary: Turn email copies of your notifications on or off
      description: In-app notifications are unaffected.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmailPreference"
      responses:
        "200":
          description: Saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmailPreference"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /email/status:
    get:
      operationId: getEmailStatus
      tags: [email]
      summary: Email delivery status (super admin)
      description: Requires staff.manage. Whether sending is configured, the sender, counts per status, and the 25 latest messages (no bodies).
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmailStatus"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /email/settings:
    get:
      operationId: getEmailSettings
      tags: [email]
      summary: Email settings (super admin)
      description: Requires staff.manage. Secrets are never returned, only whether they are set.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmailSettings"
        "400":
          $ref: "#/components/responses/Invalid"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    put:
      operationId: saveEmailSettings
      tags: [email]
      summary: Save email settings (super admin)
      description: Requires staff.manage. Send only the fields to change; an empty string clears a saved value. A new Resend key or Supabase token is checked with the provider before saving. Audited without secret values.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmailSettingsInput"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmailSettings"
        "400":
          $ref: "#/components/responses/Invalid"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /email/test:
    post:
      operationId: sendTestEmail
      tags: [email]
      summary: Send a test email (super admin)
      description: Sends straight through Resend with the current settings.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TestEmailInput"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
        "400":
          $ref: "#/components/responses/Invalid"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /email/domain:
    get:
      operationId: getEmailDomain
      tags: [email]
      summary: The sending and receiving domain in Resend, with DNS records (super admin)
      description: Null when no domain has been added.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                oneOf: [{{ $ref: "#/components/schemas/EmailDomain" }}, {{ type: "null" }}]
        "400":
          $ref: "#/components/responses/Invalid"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      operationId: addEmailDomain
      tags: [email]
      summary: Add the domain in Resend (super admin)
      description: Reuses the domain if it already exists in the Resend account.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmailDomainInput"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmailDomain"
        "400":
          $ref: "#/components/responses/Invalid"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /email/domain/verify:
    post:
      operationId: verifyEmailDomain
      tags: [email]
      summary: Ask Resend to check the domain's DNS records (super admin)
      description: Returns the domain with each record's current status.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmailDomain"
        "400":
          $ref: "#/components/responses/Invalid"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /email/auth-settings:
    get:
      operationId: getSignupEmailSetting
      tags: [email]
      summary: Sign-up email confirmation and the Send Email Hook status (super admin)
      description: The hook's server side (secret, Resend) always; Supabase's side (confirmation, hook enabled and its URL) only with the saved access token, else connected is false.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SignupEmailSetting"
        "400":
          $ref: "#/components/responses/Invalid"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    put:
      operationId: setSignupEmailSetting
      tags: [email]
      summary: Turn sign-up email confirmation on or off (super admin)
      description: Changes the Supabase project's auth setting through the Management API. Audited.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SignupEmailSettingInput"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SignupEmailSetting"
        "400":
          $ref: "#/components/responses/Invalid"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /branding:
    get:
      operationId: getBranding
      tags: [email]
      security: []
      summary: The application name, colours, logos, and favicon (public)
      description: Shown on every page, including sign-in pages, so no sign-in is needed. Colours and image addresses are null when the default is in use.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Branding"
    put:
      operationId: setBranding
      tags: [email]
      summary: Change the application name (super admin)
      description: Applies to the portal, emails, and new authenticator entries. An empty name restores the default. Audited.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BrandingInput"
      responses:
