openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: The signed-in user
  - name: staff
    description: Staff members and roles
  - name: programs
    description: Grant programs
  - name: profile
    description: The signed-in applicant's profile
  - name: applicants
    description: Applicant directory and account controls (staff)
  - name: applications
    description: Grant applications and review
  - name: activity
    description: Notifications, the staff activity feed, and the audit log
  - name: money
    description: The ledger, deposits, payouts, cards, money settings, and the lockdown
  - name: email
    description: Email preferences and delivery status
  - name: documents
    description: Identity documents and application evidence (files kept on the API server's disk)
security:
  - bearerAuth: []
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      security: []
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /me:
    get:
      operationId: getMe
      tags: [auth]
      summary: Current user
      description: The signed-in user, and their staff record if they are staff. Links a staff record to this user on first sign-in with a confirmed email.
      responses:
        "200":
          description: Signed-in user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /staff:
    get:
      operationId: listStaff
      tags: [staff]
      summary: List staff members
      description: Requires the staff.manage permission.
      responses:
        "200":
          description: Staff members
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/StaffMember"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      operationId: createStaffMember
      tags: [staff]
      summary: Add a staff member
      description: Requires the staff.manage permission. The person gets access when they sign in with this email and have confirmed it.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StaffMemberCreate"
      responses:
        "201":
          description: Created staff member
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StaffMember"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: A staff member with this email already exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /staff/{id}:
    patch:
      operationId: updateStaffMember
      tags: [staff]
      summary: Change a staff member's role or access
      description: Requires the staff.manage permission. At least one active super admin must remain, and nobody can disable their own access.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StaffMemberUpdate"
      responses:
        "200":
          description: Updated staff member
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StaffMember"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /programs:
    get:
      operationId: listPrograms
      tags: [programs]
      summary: List grant programs
      description: Active staff see every program, drafts included. Everyone else sees open and closed programs only.
      responses:
        "200":
          description: Programs, oldest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Program"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      operationId: createProgram
      tags: [programs]
      summary: Create a draft program
      description: Requires the programs.manage permission. New programs start as drafts, visible to staff only.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProgramInput"
      responses:
        "201":
          description: Created program
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProgramResult"
        "400":
          $ref: "#/components/responses/Invalid"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /programs/{id}:
    parameters:
      - $ref: "#/components/parameters/ProgramId"
    put:
      operationId: updateProgram
      tags: [programs]
      summary: Edit a program
      description: Requires the programs.manage permission. Fails with 409 if the program changed after `version` was read.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProgramUpdate"
      responses:
        "200":
          description: Saved program
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProgramResult"
        "400":
          $ref: "#/components/responses/Invalid"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Stale"
  /programs/{id}/delete:
    parameters:
      - $ref: "#/components/parameters/ProgramId"
    post:
      operationId: deleteProgram
      tags: [programs]
      summary: Delete an unused draft
      description: Requires the programs.manage permission. Only drafts without applications can be deleted; published programs are closed instead.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProgramVersion"
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
        "400":
          $ref: "#/components/responses/Invalid"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Stale"
  /programs/{id}/publish:
    parameters:
      - $ref: "#/components/parameters/ProgramId"
    post:
      operationId: publishProgram
      tags: [programs]
      summary: Publish a draft or reopen a closed program
      description: Requires the programs.manage permission. The program must be valid with a deadline today or later.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProgramVersion"
      responses:
        "200":
          description: Open program
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProgramResult"
        "400":
          $ref: "#/components/responses/Invalid"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Stale"
  /programs/{id}/close:
    parameters:
      - $ref: "#/components/parameters/ProgramId"
    post:
      operationId: closeProgram
      tags: [programs]
      summary: Close a program to new applications
      description: Requires the programs.manage permission. Applications already submitted continue through review.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProgramVersion"
      responses:
        "200":
          description: Closed program
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProgramResult"
        "400":
          $ref: "#/components/responses/Invalid"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Stale"
  /profile:
    get:
      operationId: getProfile
      tags: [profile]
      summary: The signed-in person's applicant profile
      description: Created on first request from the details given at sign-up. The email always matches the sign-in account.
      responses:
        "200":
          description: Profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Profile"
        "401":
          $ref: "#/components/responses/Unauthorized"
    patch:
      operationId: updateProfile
      tags: [profile]
      summary: Edit your personal details
      description: The email is the sign-in account's; tier and identity status are set by staff.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProfileUpdate"
      responses:
        "200":
          description: Saved profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Profile"
        "400":
          $ref: "#/components/responses/Invalid"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /profile/identity:
    post:
      operationId: submitIdentityCheck
      tags: [profile]
      summary: Submit your identity details
      description: Only the last four characters of the document number are kept. Compliance reviews the check.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IdentitySubmission"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Profile"
        "400":
          $ref: "#/components/responses/Invalid"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Stale"
  /profile/avatar:
    get:
      operationId: getAvatar
      tags: [profile]
      summary: Your profile photo
      description: Owner only. The content is checked against the SHA-256 recorded at upload.
      responses:
        "200":
          description: The image
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      operationId: uploadAvatar
      tags: [profile]
      summary: Upload a new profile photo
      description: The raw image is the request body (JPEG, PNG, or WEBP, detected from the content; at most 5 MB). Replaces the previous photo. Stored on the API server's disk, never in Supabase Storage.
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
      responses:
        "200":
          description: Saved profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Profile"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "413":
          $ref: "#/components/responses/BadRequest"
        "415":
          $ref: "#/components/responses/BadRequest"
  /profile/avatar/delete:
    post:
      operationId: removeAvatar
      tags: [profile]
      summary: Remove your profile photo
      description: Deletes the file; the profile shows your initials again.
      responses:
        "200":
          description: Saved profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Profile"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /profile/privacy:
    put:
      operationId: setPrivacy
      tags: [profile]
      summary: Save your privacy and security switches
      description: Activity logging keeps the device, IP address, and location with each security event; unusual-activity email sends an alert when a new device signs in.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PrivacyPreferences"
      responses:
        "200":
          description: Saved profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Profile"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /profile/security-events:
    get:
      operationId: listSecurityEvents
      tags: [profile]
      summary: Your recent security activity
      description: Newest first, at most 50.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SecurityEvent"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      operationId: reportSecurityEvent
      tags: [profile]
      summary: Record a security change made in the browser
      description: The portal reports changes Supabase made directly (two-step on or off, signing out other devices, an email change requested). Two-step changes are recorded only if the session's verified factors agree.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SecurityEventReport"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SecurityEventResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /profile/check-password:
    post:
      operationId: checkPassword
      tags: [profile]
      summary: Confirm your current password
      description: Checked with Supabase from the server (the throwaway session is signed out straight away), before changing your password or email. A wrong password is recorded as a failed attempt.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordCheck"
      responses:
        "200":
          description: The password is right
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
        "400":
          $ref: "#/components/responses/Invalid"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/BadRequest"
        "503":
          $ref: "#/components/responses/BadRequest"
  /sign-ins:
    post:
      operationId: reportSignIn
      tags: [profile]
      summary: Record a completed sign-in from this browser
      description: Called by the portal after sign-in (and two-step, when needed). Applicants get an in-app notice every time and an email for a new device; staff get an email for a new device.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SignInReport"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SignInResult"
        "400":
          $ref: "#/components/responses/Invalid"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /profile/password-changed:
    post:
      operationId: reportPasswordChanged
      tags: [profile]
      summary: Record that the applicant changed their password
      description: Called by the portal after Supabase accepted a new password. Notifies the applicant in the app and by email.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Profile"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /profile/credential-reset:
    post:
      operationId: completeCredentialReset
      tags: [profile]
      summary: Confirm a reset the grant team asked for
      description: Records that you chose a new password or set up two-step sign-in again.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CredentialReset"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Profile"
        "400":
          $ref: "#/components/responses/Invalid"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Stale"
  /applicants:
    get:
      operationId: listApplicants
      tags: [applicants]
      summary: Applicant directory
      description: Any active staff member. Newest first.
      responses:
        "200":
          description: Applicants
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ApplicantEntry"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /applicants/{id}/tier:
    parameters:
      - $ref: "#/components/parameters/ApplicantId"
    post:
      operationId: setApplicantTier
      tags: [applicants]
      summary: Change an applicant's tier
      description: Requires accounts.tier. A reason is required; the applicant is told.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TierChange"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApplicantResult"
        "400":
          $ref: "#/components/responses/Invalid"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Stale"
  /applicants/{id}/card-settings:
    parameters:
      - $ref: "#/components/parameters/ApplicantId"
    post:
      operationId: setCardSettings
      tags: [applicants]
      summary: Set an applicant's card rules
      description: Requires accounts.manage. Which balances they may fund their card from, and whether cards need a verified identity.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CardSettings"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApplicantResult"
        "400":
          $ref: "#/components/responses/Invalid"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Stale"
  /applicants/{id}/permissions:
    parameters:
      - $ref: "#/components/parameters/ApplicantId"
    post:
      operationId: setAccountPermission
      tags: [applicants]
      summary: Turn one of an applicant's permission switches on or off
      description: Requires accounts.manage. Identity checks for payouts and deposits, email copies of notifications, card applications, and new grant applications. The applicant is notified.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccountPermissionChange"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApplicantResult"
        "400":
          $ref: "#/components/responses/Invalid"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Stale"
  /applicants/{id}/lock:
    parameters:
      - $ref: "#/components/parameters/ApplicantId"
    post:
      operationId: lockApplicant
      tags: [applicants]
      summary: Lock an account
      description: Requires accounts.manage. Blocks applications and money actions until unlocked.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Reason"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApplicantResult"
        "400":
          $ref: "#/components/responses/Invalid"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Stale"
  /applicants/{id}/unlock:
    parameters:
      - $ref: "#/components/parameters/ApplicantId"
    post:
      operationId: unlockApplicant
      tags: [applicants]
      summary: Unlock an account
      description: Requires accounts.manage.
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApplicantResult"
        "400":
          $ref: "#/components/responses/Invalid"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Stale"
  /applicants/{id}/credential-reset:
    parameters:
      - $ref: "#/components/parameters/ApplicantId"
    post:
      operationId: requireCredentialReset
      tags: [applicants]
      summary: Require a new password or two-step setup
      description: Requires accounts.manage. Recorded for the applicant to complete.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CredentialReset"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApplicantResult"
        "400":
          $ref: "#/components/responses/Invalid"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Stale"
  /applicants/{id}/identity/approve:
    parameters:
      - $ref: "#/components/parameters/ApplicantId"
    post:
      operationId: approveIdentityCheck
      tags: [applicants]
      summary: Approve an identity check
      description: Requires kyc.review.
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApplicantResult"
        "400":
          $ref: "#/components/responses/Invalid"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Stale"
  /applicants/{id}/identity/reject:
    parameters:
      - $ref: "#/components/parameters/ApplicantId"
    post:
      operationId: rejectIdentityCheck
      tags: [applicants]
      summary: Reject an identity check
      description: Requires kyc.review. The reason is shown to the applicant.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Reason"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApplicantResult"
        "400":
          $ref: "#/components/responses/Invalid"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Stale"
  /applicants/{id}/identity/reverify:
    parameters:
      - $ref: "#/components/parameters/ApplicantId"
    post:
      operationId: requestReverification
      tags: [applicants]
      summary: Ask a verified applicant to verify again
      description: Requires kyc.review. The reason is shown to the applicant.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Reason"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApplicantResult"
        "400":
          $ref: "#/components/responses/Invalid"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Stale"
  /applications/mine:
    get:
      operationId: listMyApplications
