      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                oneOf: [{{ $ref: "#/components/schemas/EmailDomain" }}, {{ type: "null" }}]
        "400":
          $ref: "#/components/responses/Invalid"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      operationId: addEmailDomain
      tags: [email]
      summary: Add the domain in Resend (super admin)
      description: Reuses the domain if it already exists in the Resend account.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmailDomainInput"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmailDomain"
        "400":
          $ref: "#/components/responses/Invalid"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /email/domain/verify:
    post:
      operationId: verifyEmailDomain
      tags: [email]
      summary: Ask Resend to check the domain's DNS records (super admin)
      description: Returns the domain with each record's current status.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmailDomain"
        "400":
          $ref: "#/components/responses/Invalid"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /email/auth-settings:
    get:
      operationId: getSignupEmailSetting
      tags: [email]
      summary: Whether new accounts must confirm their email (super admin)
      description: Read from Supabase with the saved access token; connected is false without one.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SignupEmailSetting"
        "400":
          $ref: "#/components/responses/Invalid"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    put:
      operationId: setSignupEmailSetting
      tags: [email]
      summary: Turn sign-up email confirmation on or off (super admin)
      description: Changes the Supabase project's auth setting through the Management API. Audited.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SignupEmailSettingInput"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SignupEmailSetting"
        "400":
          $ref: "#/components/responses/Invalid"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /email/auth-settings/smtp:
    post:
      operationId: sendAuthEmailsThroughResend
      tags: [email]
      summary: Send Supabase's sign-up, reset, and two-step emails through Resend (super admin)
      description: Sets the Supabase project's custom SMTP to Resend's relay with the saved Resend key and sender. Refused while the saved domain isn't verified. Audited.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SignupEmailSetting"
        "400":
          $ref: "#/components/responses/Invalid"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /email/auth-settings/templates:
    post:
      operationId: setAuthEmailTemplates
      tags: [email]
      summary: Use the app's wording for Supabase's sign-in emails (super admin)
      description: Sets the subject and body of the confirmation, reset, invite, email-change, sign-in link, and verification-code emails. Audited.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SignupEmailSetting"
        "400":
          $ref: "#/components/responses/Invalid"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /inbox:
    get:
      operationId: getInbox
      tags: [email]
      summary: The team mailbox (staff)
      description: Any active staff member. Up to 200 messages in the folder, newest first.
      parameters:
        - name: folder
          in: query
          required: false
          schema:
            type: string
            enum: [inbox, sent, archive, trash]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InboxView"
        "400":
          $ref: "#/components/responses/Invalid"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /inbox/send:
    post:
      operationId: sendInboxEmail
      tags: [email]
      summary: Send or reply from the team mailbox (staff)
      description: Sent through Resend from the team mailbox address; replies keep the thread headers. Audited.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InboxSendInput"
      responses:
        "201":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InboxMessage"
        "400":
          $ref: "#/components/responses/Invalid"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /inbox/{id}/update:
    parameters:
      - $ref: "#/components/parameters/DocumentId"
    post:
      operationId: updateInboxMessage
      tags: [email]
      summary: Move a message or mark it read (staff)
      description: Folder inbox, sent, archive, or trash.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InboxUpdateInput"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InboxMessage"
        "400":
          $ref: "#/components/responses/Invalid"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Supabase Auth access token
  parameters:
    DocumentId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    LedgerId:
      name: id
      in: path
      required: true
      schema:
        type: string
        pattern: "^TX-[0-9]{1,15}$"
    ChannelParam:
      name: channel
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/ChannelId"
    NotificationId:
      name: id
      in: path
      required: true
      schema:
        type: string
        pattern: "^NT-[0-9]{1,15}$"
    FeedId:
      name: id
      in: path
      required: true
      schema:
        type: string
        pattern: "^FD-[0-9]{1,15}$"
    ApplicationId:
      name: id
      in: path
      required: true
      schema:
        type: string
        pattern: "^[A-Za-z0-9-]{1,40}$"
    ApplicantId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ProgramId:
      name: id
      in: path
      required: true
      schema:
        type: string
        pattern: "^[A-Za-z0-9-]{1,40}$"
  responses:
    Invalid:
      description: The change was refused; `fieldErrors` names the fields to fix
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ValidationError"
    Stale:
      description: The record changed since it was read; reload it and try again
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    BadRequest:
      description: The request was not valid
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthorized:
      description: Missing, invalid, or expired sign-in token
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Forbidden:
      description: Signed in, but not allowed to do this
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: Not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  schemas:
    EmailSettings:
      type: object
      properties:
        resendKey:
          type: object
          properties:
            set: { type: boolean }
            last4: { type: [string, "null"] }
            source: { type: string, enum: [settings, environment, none] }
          required: [set, last4, source]
        from: { type: [string, "null"] }
        fromSource: { type: string, enum: [settings, environment, none] }
        replyTo: { type: [string, "null"] }
        appUrl: { type: [string, "null"] }
        inboxAddress: { type: [string, "null"] }
        domain:
          oneOf:
            - type: object
              properties:
                name: { type: string }
                id: { type: [string, "null"] }
              required: [name, id]
            - type: "null"
        webhook:
          type: object
          properties:
            url: { type: [string, "null"] }
            secretSet: { type: boolean }
          required: [url, secretSet]
        supabaseToken:
          type: object
          properties:
            set: { type: boolean }
          required: [set]
        sending: { type: boolean }
        updatedAt: { type: [string, "null"] }
        updatedBy: { type: [string, "null"] }
      required: [resendKey, from, fromSource, replyTo, appUrl, inboxAddress, domain, webhook, supabaseToken, sending, updatedAt, updatedBy]
    EmailSettingsInput:
      type: object
      properties:
        resendKey: { type: string }
        fromAddress: { type: string }
        replyTo: { type: string }
        appUrl: { type: string }
        inboxAddress: { type: string }
        webhookSecret: { type: string }
        supabaseToken: { type: string }
    TestEmailInput:
      type: object
      properties:
        to: { type: string }
      required: [to]
    EmailDomainInput:
      type: object
      properties:
        name: { type: string }
        receiving: { type: boolean }
      required: [name]
    EmailDomain:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        status: { type: string }
        region: { type: string }
        capabilities:
          type: object
          properties:
            sending: { type: string }
            receiving: { type: string }
        records:
          type: array
          items:
            type: object
            properties:
              record: { type: string }
              name: { type: string }
              type: { type: string }
              value: { type: string }
              priority: { type: number }
              ttl: { type: string }
              status: { type: string }
            required: [record, name, type, status]
      required: [id, name, status]
    SignupEmailSetting:
      type: object
      properties:
        connected: { type: boolean }
        emailConfirmation: { type: [boolean, "null"] }
        smtp:
          type: object
          properties:
            viaResend: { type: boolean }
            host: { type: [string, "null"] }
            sender: { type: [string, "null"] }
            emailsPerHour: { type: [integer, "null"] }
          required: [viaResend, host, sender, emailsPerHour]
        appTemplates: { type: boolean }
        error: { type: string }
      required: [connected, emailConfirmation]
    SignupEmailSettingInput:
      type: object
      properties:
        emailConfirmation: { type: boolean }
      required: [emailConfirmation]
    InboxMessage:
      type: object
      properties:
        id: { type: string }
        direction: { type: string, enum: [inbound, outbound] }
        resendId: { type: [string, "null"] }
        messageId: { type: [string, "null"] }
        inReplyTo: { type: [string, "null"] }
        from: { type: string }
        to: { type: array, items: { type: string } }
        cc: { type: array, items: { type: string } }
        subject: { type: string }
        text: { type: [string, "null"] }
        html: { type: [string, "null"] }
        attachments:
          type: array
          items:
            type: object
            properties:
              id: { type: string }
              filename: { type: string }
              contentType: { type: string }
              size: { type: [number, "null"] }
            required: [id, filename, contentType, size]
        status: { type: [string, "null"] }
        folder: { type: string, enum: [inbox, sent, archive, trash] }
        read: { type: boolean }
        sentBy: { type: [string, "null"] }
        at: { type: string }
      required: [id, direction, resendId, messageId, inReplyTo, from, to, cc, subject, text, html, attachments, status, folder, read, sentBy, at]
    InboxView:
      type: object
      properties:
        address: { type: [string, "null"] }
        receiving: { type: boolean }
        sending: { type: boolean }
        unread: { type: integer }
        messages:
          type: array
          items:
            $ref: "#/components/schemas/InboxMessage"
      required: [address, receiving, sending, unread, messages]
    InboxSendInput:
      type: object
      properties:
        to: { type: string }
        cc: { type: string }
        subject: { type: string }
        text: { type: string }
        inReplyTo: { type: string }
      required: [to, subject, text]
    InboxUpdateInput:
      type: object
      properties:
        folder: { type: string, enum: [inbox, sent, archive, trash] }
        read: { type: boolean }
    EmailPreference:
      type: object
      properties:
        enabled:
          type: boolean
      required: [enabled]
    EmailOutboxStatus:
      type: string
      enum: [queued, sending, sent, failed, skipped]
    EmailStatus:
      type: object
      properties:
        configured:
          type: boolean
        from:
          type: [string, "null"]
        counts:
          type: object
          properties:
            queued:
              type: integer
            sending:
              type: integer
            sent:
              type: integer
            failed:
              type: integer
            skipped:
              type: integer
          required: [queued, sending, sent, failed, skipped]
        recent:
          type: array
          items:
            type: object
            properties:
              seq:
                type: integer
              kind:
                type: string
                enum: [notification, staff-invite]
              to:
                type: string
              subject:
                type: string
              status:
                $ref: "#/components/schemas/EmailOutboxStatus"
              attempts:
                type: integer
              lastError:
                type: [string, "null"]
              createdAt:
                type: string
                format: date-time
              sentAt:
                type: [string, "null"]
                format: date-time
            required: [seq, kind, to, subject, status, attempts, lastError, createdAt, sentAt]
      required: [configured, from, counts, recent]
    DocumentPurpose:
      type: string
      enum: [identity, application]
    Document:
      type: object
      properties:
        id:
          type: string
          format: uuid
        purpose:
          $ref: "#/components/schemas/DocumentPurpose"
        applicationId:
          type: [string, "null"]
        requirement:
          type: [string, "null"]
        fileName:
          type: string
        contentType:
          type: string
          enum: [application/pdf, image/jpeg, image/png]
        sizeBytes:
          type: integer
        uploadedAt:
          type: string
          format: date-time
      required: [id, purpose, applicationId, requirement, fileName, contentType, sizeBytes, uploadedAt]
    ChannelId:
      type: string
      enum: [bank, wire, mobile, crypto]
    LedgerEntry:
      type: object
      properties:
        id:
          type: string
        applicantId:
          type: string
        type:
          type: string
          enum: [Grant, Deposit, Withdrawal, Card fee, Application fee]
        description:
          type: string
        amount:
          type: number
          description: Signed; credits positive, debits negative
        status:
          type: string
          enum: [Completed, Pending, Failed, Cancelled]
        createdAt:
          type: string
        method:
          type: string
        fee:
          type: number
        destination:
          type: string
        reference:
          type: string
        processedAt:
          type: string
        processedBy:
          type: string
        failureReason:
          type: string
        dualControl:
          type: boolean
        releaseApproval:
          type: object
          properties:
            by:
              type: string
            at:
              type: string
            byId:
              type: string
          required: [by, at]
      required: [id, applicantId, type, description, amount, status, createdAt]
    PayoutChannel:
      type: object
      properties:
        id:
          $ref: "#/components/schemas/ChannelId"
        name:
          type: string
        enabled:
          type: boolean
        min:
          type: number
        max:
          type: number
        feeRate:
          type: number
        feeFixed:
          type: number
        feeCap:
          type: number
      required: [id, name, enabled, min, max, feeRate, feeFixed, feeCap]
      additionalProperties: false
    TreasuryInput:
      type: object
      properties:
        channels:
          type: array
          maxItems: 10
          items:
            $ref: "#/components/schemas/PayoutChannel"
        physicalCardFee:
          type: number
        cardDeliveryFee:
          type: number
        minDeposit:
          type: number
        maxDeposit:
          type: number
        depositThreshold:
          type: number
        highValueDeposit:
          type: number
        dualControlThreshold:
          type: number
        applicationFee:
          type: number
      required: [channels, physicalCardFee, cardDeliveryFee, minDeposit, maxDeposit, depositThreshold, highValueDeposit, dualControlThreshold, applicationFee]
      additionalProperties: false
    Treasury:
      allOf:
        - $ref: "#/components/schemas/TreasuryInput"
        - type: object
          properties:
            updatedAt:
              type: string
            changeLog:
              type: array
              description: Staff only; empty for applicants
              items:
                $ref: "#/components/schemas/ProgramChange"
          required: [updatedAt, changeLog]
    Lockdown:
      type: object
      properties:
        since:
          type: string
        by:
          type: string
        reason:
          type: string
      required: [since, by, reason]
    MoneySettings:
      type: object
      properties:
        treasury:
          $ref: "#/components/schemas/Treasury"
        lockdown:
          allOf:
            - $ref: "#/components/schemas/Lockdown"
          nullable: true
      required: [treasury, lockdown]
    MoneySettingsResult:
      type: object
      properties:
        settings:
          $ref: "#/components/schemas/MoneySettings"
        message:
          type: string
      required: [settings, message]
    MoneySettingsUpdate:
      type: object
      properties:
        version:
          type: string
          maxLength: 40
        treasury:
          $ref: "#/components/schemas/TreasuryInput"
      required: [version, treasury]
      additionalProperties: false
    Cards:
      type: object
      properties:
        virtual:
          type: object
          properties:
            lastFour:
              type: string
            dailyLimit:
              type: number
            frozen:
              type: boolean
            pin:
              type: string
              description: Fictional; no card provider is connected
          required: [lastFour, dailyLimit, frozen, pin]
        physical:
          type: object
          properties:
            status:
              type: string
              enum: [Not requested, Requested]
            dailyLimit:
              type: number
          required: [status, dailyLimit]
      required: [virtual, physical]
    MyMoney:
      type: object
      properties:
        transactions:
          type: array
          items:
            $ref: "#/components/schemas/LedgerEntry"
        cards:
          $ref: "#/components/schemas/Cards"
        payoutDestinations:
          type: object
          additionalProperties:
            type: string
        destinationChangedAt:
          type: string
        treasury:
          $ref: "#/components/schemas/Treasury"
        lockdown:
          allOf:
            - $ref: "#/components/schemas/Lockdown"
          nullable: true
      required: [transactions, cards, payoutDestinations, treasury, lockdown]
    MoneyResult:
      type: object
      properties:
        money:
          $ref: "#/components/schemas/MyMoney"
        message:
          type: string
        id:
          type: string
          description: The ledger entry the action created or changed, if any
      required: [money, message]
    LedgerResult:
      type: object
      properties:
        transaction:
          $ref: "#/components/schemas/LedgerEntry"
        message:
          type: string
      required: [transaction, message]
    DepositRequest:
      type: object
      properties:
        amount:
          type: number
        method:
          type: string
          enum: [bank, mobile]
      required: [amount, method]
      additionalProperties: false
    WithdrawalRequest:
      type: object
      properties:
        amount:
          type: number
        channel:
          $ref: "#/components/schemas/ChannelId"
      required: [amount, channel]
      additionalProperties: false
    CardLimit:
      type: object
      properties:
        card:
          type: string
          enum: [virtual, physical]
        limit:
          type: number
      required: [card, limit]
      additionalProperties: false
    DestinationInput:
      type: object
      properties:
        channel:
          $ref: "#/components/schemas/ChannelId"
        primary:
          type: string
          maxLength: 80
        secondary:
          type: string
          maxLength: 80
      required: [channel, primary]
      additionalProperties: false
    NotificationItem:
      type: object
      properties:
        id:
          type: string
        at:
          type: string
        title:
          type: string
        body:
          type: string
        href:
          type: string
        read:
          type: boolean
      required: [id, at, title, body, href, read]
    StaffFeedItem:
      type: object
      properties:
        id:
          type: string
        at:
          type: string
        kind:
          type: string
          enum: [application, deposit, withdrawal, card, security, account]
        title:
          type: string
        body:
          type: string
        href:
          type: string
        highlight:
          type: boolean
        read:
          type: boolean
      required: [id, at, kind, title, body, href, highlight, read]
    AuditItem:
      type: object
      properties:
        id:
          type: string
        at:
          type: string
        staffId:
          type: string
        staffName:
          type: string
        role:
          type: string
        action:
          type: string
        target:
          type: string
        applicantId:
          type: string
          nullable: true
        summary:
          type: string
        changes:
          type: array
          items:
            type: object
            properties:
              field:
                type: string
              before:
                type: string
              after:
                type: string
            required: [field, before, after]
        riskScore:
          type: integer
          nullable: true
        ip:
          type: string
          nullable: true
      required: [id, at, staffId, staffName, role, action, target, applicantId, summary, changes, riskScore, ip]
    AuditLog:
      type: object
      properties:
        events:
          type: array
          items:
            $ref: "#/components/schemas/AuditItem"
        chain:
          type: object
          description: Whether every entry still matches its hash and links to the one before
          properties:
            intact:
              type: boolean
            checked:
              type: integer
            brokenAt:
              type: string
          required: [intact, checked]
      required: [events, chain]
    ApplicationStatus:
      type: string
      enum: [Draft, Submitted, Under review, Changes requested, Approved, Declined]
    ApplicationInput:
      type: object
      properties:
        businessName:
          type: string
          maxLength: 200
        requestedAmount:
          type: number
        registrationNumber:
          type: string
          maxLength: 80
        purpose:
          type: string
          maxLength: 5000
        checklist:
          type: array
          maxItems: 20
          items:
            type: string
            maxLength: 200
        answers:
          type: object
          maxProperties: 20
          additionalProperties:
            type: string
            maxLength: 1000
      required: [businessName, requestedAmount, registrationNumber, purpose, checklist, answers]
      additionalProperties: false
    ApplicationSubmission:
      type: object
      properties:
        grantId:
          type: string
          maxLength: 40
        draftId:
          type: string
          maxLength: 40
          description: Your existing draft (or application with changes requested), if any
        application:
          $ref: "#/components/schemas/ApplicationInput"
      required: [grantId, application]
      additionalProperties: false
    ApplicationEvent:
      type: object
      properties:
        status:
          $ref: "#/components/schemas/ApplicationStatus"
        at:
          type: string
        actor:
          type: string
          enum: [Applicant, Reviewer]
        note:
          type: string
