        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /branding/colors:
    put:
      operationId: setBrandColors
      tags: [email]
      summary: Change the app and email colours (super admin)
      description: Each colour is `#RRGGBB`, or null for the default; only the colours sent change. The app colour applies to the portal and admin for everyone; the email colour to the top bar and button of every email. Audited.
      requestBody:
        required: true
        content:
