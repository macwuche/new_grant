            requestedAt:
              type: string
            feeTxId:
              type: string
            issuedBy:
              type: string
            shippedAt:
              type: string
            shippedBy:
              type: string
            trackingRef:
              type: string
            shippingMessage:
              type: string
            activatedAt:
              type: string
            declinedAt:
              type: string
            declinedBy:
              type: string
            declineReason:
              type: string
            cancelledAt:
