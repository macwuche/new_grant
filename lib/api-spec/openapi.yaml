          description: The image
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      operationId: uploadBrandLogoDark
      tags: [email]
      summary: Upload the logo for dark backgrounds (super admin)
      description: The raw image is the body (PNG, JPEG, or WEBP, detected from the content; at most 2 MB). Stored on the API server's disk; replaces the previous one. Audited.
      requestBody:
