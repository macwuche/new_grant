            frozen:
              type: boolean
            createdAt:
              type: string
            createdBy:
              type: string
            frozenBy:
              type: string
              enum: [applicant, staff]
            frozenReason:
              type: string
          required: [lastFour, dailyLimit, frozen]
        physical:
          type: object
          properties:
            status:
              type: string
              enum: [Not requested, Requested, Shipped, Active, Declined, Cancelled]
            dailyLimit:
              type: number
            lastFour:
              type: string
            frozen:
              type: boolean
            frozenBy:
              type: string
              enum: [applicant, staff]
            frozenReason:
              type: string
            shippingAddress:
              $ref: "#/components/schemas/ShippingAddress"
            requestedAt:
              type: string
            feeTxId:
              type: string
            issuedBy:
              type: string
            shippedAt:
              type: string
            shippedBy:
              type: string
            trackingRef:
              type: string
            shippingMessage:
              type: string
            activatedAt:
              type: string
            declinedAt:
              type: string
            declinedBy:
              type: string
            declineReason:
              type: string
            cancelledAt:
              type: string
            cancelledBy:
              type: string
            cancelReason:
              type: string
          required: [status, dailyLimit]
