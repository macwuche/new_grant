        "401":
          $ref: "#/components/responses/Unauthorized"
  /documents:
    get:
      operationId: listDocuments
      tags: [documents]
      summary: An applicant's or application's documents (staff)
      description: Any active staff member; only the kinds of document the role may open are listed (identity needs kyc.review; application evidence needs applications.review, applications.clearEscalation, or kyc.review).
      parameters:
        - name: applicantId
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - name: applicationId
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Document"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      operationId: uploadDocument
      tags: [documents]
      summary: Upload a document
      description: The raw file is the request body (at most 10 MB; PDF, JPEG, or PNG, detected from the content). Put the URI-encoded file name in the X-File-Name header. Application evidence must name a saved application of yours that is a draft or has changes requested, and one of its program's requirements. Identity documents can't change while a check is pending or verified.
      parameters:
        - name: purpose
          in: query
          required: true
          schema:
            $ref: "#/components/schemas/DocumentPurpose"
        - name: applicationId
          in: query
          required: false
          schema:
            type: string
        - name: requirement
          in: query
          required: false
          schema:
            type: string
        - name: X-File-Name
          in: header
          required: false
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
      responses:
        "201":
          description: Stored
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Document"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Stale"
        "413":
          $ref: "#/components/responses/BadRequest"
        "415":
          $ref: "#/components/responses/BadRequest"
