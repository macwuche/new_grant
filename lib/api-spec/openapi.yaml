    post:
      operationId: updateInboxMessage
      tags: [email]
      summary: Move a message or mark it read (staff)
      description: Folder inbox, sent, archive, or trash.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InboxUpdateInput"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InboxMessage"
        "400":
          $ref: "#/components/responses/Invalid"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Supabase Auth access token
  parameters:
    DocumentId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    LedgerId:
      name: id
      in: path
      required: true
      schema:
        type: string
        pattern: "^TX-[0-9]{1,15}$"
    MethodIdParam:
      name: methodId
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/ChannelId"
    ProofIdParam:
      name: proofId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    NotificationId:
      name: id
      in: path
      required: true
      schema:
        type: string
        pattern: "^NT-[0-9]{1,15}$"
    FeedId:
      name: id
      in: path
      required: true
      schema:
        type: string
        pattern: "^FD-[0-9]{1,15}$"
    ApplicationId:
      name: id
      in: path
      required: true
      schema:
        type: string
        pattern: "^[A-Za-z0-9-]{1,40}$"
    ApplicantId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ProgramId:
      name: id
      in: path
      required: true
      schema:
        type: string
        pattern: "^[A-Za-z0-9-]{1,40}$"
  responses:
    Invalid:
      description: The change was refused; `fieldErrors` names the fields to fix
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ValidationError"
    Stale:
      description: The record changed since it was read; reload it and try again
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    BadRequest:
      description: The request was not valid
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthorized:
      description: Missing, invalid, or expired sign-in token
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Forbidden:
      description: Signed in, but not allowed to do this
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: Not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  schemas:
    EmailSettings:
      type: object
      properties:
        resendKey:
          type: object
          properties:
            set: { type: boolean }
            last4: { type: [string, "null"] }
            source: { type: string, enum: [settings, environment, none] }
          required: [set, last4, source]
        from: { type: [string, "null"] }
        fromSource: { type: string, enum: [settings, environment, none] }
        replyTo: { type: [string, "null"] }
        appUrl: { type: [string, "null"] }
        inboxAddress: { type: [string, "null"] }
        domain:
          oneOf:
            - type: object
              properties:
                name: { type: string }
                id: { type: [string, "null"] }
              required: [name, id]
            - type: "null"
        webhook:
          type: object
          properties:
            url: { type: [string, "null"] }
            secretSet: { type: boolean }
          required: [url, secretSet]
        supabaseToken:
          type: object
          properties:
            set: { type: boolean }
          required: [set]
        sending: { type: boolean }
        updatedAt: { type: [string, "null"] }
        updatedBy: { type: [string, "null"] }
      required: [resendKey, from, fromSource, replyTo, appUrl, inboxAddress, domain, webhook, supabaseToken, sending, updatedAt, updatedBy]
    EmailSettingsInput:
      type: object
      properties:
        resendKey: { type: string }
        fromAddress: { type: string }
        replyTo: { type: string }
        appUrl: { type: string }
        inboxAddress: { type: string }
        webhookSecret: { type: string }
        supabaseToken: { type: string }
    TestEmailInput:
      type: object
      properties:
        to: { type: string }
      required: [to]
    EmailDomainInput:
      type: object
      properties:
        name: { type: string }
        receiving: { type: boolean }
      required: [name]
    EmailDomain:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        status: { type: string }
        region: { type: string }
        capabilities:
          type: object
          properties:
            sending: { type: string }
            receiving: { type: string }
        records:
          type: array
          items:
            type: object
            properties:
              record: { type: string }
              name: { type: string }
              type: { type: string }
              value: { type: string }
              priority: { type: number }
              ttl: { type: string }
              status: { type: string }
            required: [record, name, type, status]
      required: [id, name, status]
    SignupEmailSetting:
      type: object
      properties:
        connected: { type: boolean }
        emailConfirmation: { type: [boolean, "null"] }
        hook:
          type: object
          description: Supabase's Send Email Hook. Supabase sends no auth email itself; it calls this server, which sends through Resend.
          properties:
            url: { type: [string, "null"], description: The address to give Supabase (from the portal address) }
            secretSet: { type: boolean, description: SUPABASE_EMAIL_HOOK_SECRET is set on the server }
            sending: { type: boolean, description: A Resend key and sender are saved }
            enabled: { type: [boolean, "null"], description: The hook is on in Supabase; null without the access token }
            supabaseUrl: { type: [string, "null"], description: The hook address saved in Supabase; null without the access token }
          required: [url, secretSet, sending, enabled, supabaseUrl]
        error: { type: string }
      required: [connected, emailConfirmation, hook]
    SignInReport:
      type: object
      properties:
        deviceId: { type: string, description: A random id this browser keeps for sign-in alerts }
      required: [deviceId]
    SignInResult:
      type: object
      properties:
        recorded: { type: boolean }
        newDevice: { type: boolean }
      required: [recorded, newDevice]
    Branding:
      type: object
      properties:
        appName: { type: string }
        isDefault: { type: boolean }
        brandColor: { type: [string, "null"] }
        emailColor: { type: [string, "null"] }
        logoUrl: { type: [string, "null"] }
        logoDarkUrl: { type: [string, "null"] }
        faviconUrl: { type: [string, "null"] }
      required: [appName, isDefault, brandColor, emailColor, logoUrl, logoDarkUrl, faviconUrl]
    BrandColorsInput:
      type: object
      properties:
        brandColor: { type: [string, "null"] }
        emailColor: { type: [string, "null"] }
    BrandEmailPreviewInput:
      type: object
      properties:
        emailColor: { type: [string, "null"] }
    BrandEmailPreview:
      type: object
      properties:
        subject: { type: string }
        html: { type: string }
        logoShown: { type: boolean }
      required: [subject, html, logoShown]
    BrandingInput:
      type: object
      properties:
        appName: { type: string }
      required: [appName]
    SignupEmailSettingInput:
      type: object
      properties:
        emailConfirmation: { type: boolean }
      required: [emailConfirmation]
    InboxMessage:
      type: object
      properties:
        id: { type: string }
        direction: { type: string, enum: [inbound, outbound] }
        resendId: { type: [string, "null"] }
        messageId: { type: [string, "null"] }
        inReplyTo: { type: [string, "null"] }
        from: { type: string }
        to: { type: array, items: { type: string } }
        cc: { type: array, items: { type: string } }
        subject: { type: string }
        text: { type: [string, "null"] }
        html: { type: [string, "null"] }
        attachments:
          type: array
          items:
            type: object
            properties:
              id: { type: string }
              filename: { type: string }
              contentType: { type: string }
              size: { type: [number, "null"] }
            required: [id, filename, contentType, size]
        status: { type: [string, "null"] }
        folder: { type: string, enum: [inbox, sent, archive, trash] }
        read: { type: boolean }
        sentBy: { type: [string, "null"] }
        at: { type: string }
      required: [id, direction, resendId, messageId, inReplyTo, from, to, cc, subject, text, html, attachments, status, folder, read, sentBy, at]
    InboxView:
      type: object
      properties:
        address: { type: [string, "null"] }
        receiving: { type: boolean }
        sending: { type: boolean }
        unread: { type: integer }
        messages:
          type: array
          items:
            $ref: "#/components/schemas/InboxMessage"
      required: [address, receiving, sending, unread, messages]
    InboxSendInput:
      type: object
      properties:
        to: { type: string }
        cc: { type: string }
        subject: { type: string }
        text: { type: string }
        inReplyTo: { type: string }
      required: [to, subject, text]
    InboxUpdateInput:
      type: object
      properties:
        folder: { type: string, enum: [inbox, sent, archive, trash] }
        read: { type: boolean }
    EmailPreference:
      type: object
      properties:
        enabled:
          type: boolean
      required: [enabled]
    EmailOutboxStatus:
      type: string
      enum: [queued, sending, sent, failed, skipped]
    EmailStatus:
      type: object
      properties:
        configured:
          type: boolean
        from:
          type: [string, "null"]
        counts:
          type: object
          properties:
            queued:
              type: integer
            sending:
              type: integer
            sent:
              type: integer
            failed:
              type: integer
            skipped:
              type: integer
          required: [queued, sending, sent, failed, skipped]
        recent:
          type: array
          items:
            type: object
            properties:
              seq:
                type: integer
              kind:
                type: string
                enum: [notification, staff-invite, security]
              to:
                type: string
              subject:
                type: string
              status:
                $ref: "#/components/schemas/EmailOutboxStatus"
              attempts:
                type: integer
              lastError:
                type: [string, "null"]
              createdAt:
                type: string
                format: date-time
              sentAt:
                type: [string, "null"]
                format: date-time
            required: [seq, kind, to, subject, status, attempts, lastError, createdAt, sentAt]
      required: [configured, from, counts, recent]
    DocumentPurpose:
      type: string
      enum: [identity, application]
    Document:
      type: object
      properties:
        id:
          type: string
          format: uuid
        purpose:
          $ref: "#/components/schemas/DocumentPurpose"
        applicationId:
          type: [string, "null"]
        requirement:
          type: [string, "null"]
        fileName:
          type: string
        contentType:
          type: string
          enum: [application/pdf, image/jpeg, image/png]
        sizeBytes:
          type: integer
        uploadedAt:
          type: string
          format: date-time
      required: [id, purpose, applicationId, requirement, fileName, contentType, sizeBytes, uploadedAt]
    ChannelId:
      type: string
      description: A withdrawal or deposit method's id (built-in withdrawal methods are bank, wire, mobile, crypto; deposit methods bank, mobile, crypto)
      pattern: "^[a-z0-9-]{1,40}$"
    PayoutBalance:
      type: string
      enum: [grant, deposit]
    PayoutDetail:
      type: object
      properties:
        fieldId:
          type: string
        label:
          type: string
        value:
          type: string
      required: [fieldId, label, value]
    LedgerEntry:
      type: object
      properties:
        id:
          type: string
        applicantId:
          type: string
        type:
          type: string
          enum: [Grant, Deposit, Withdrawal, Card fee, Application fee, Commission, Card top-up, Card deduction, Grant adjustment, Deposit adjustment]
        description:
          type: string
        amount:
          type: number
          description: Signed; credits positive, debits negative
        status:
          type: string
          enum: [Completed, Pending, Failed, Cancelled]
        createdAt:
          type: string
        method:
          type: string
        fee:
          type: number
        destination:
          type: string
        reference:
          type: string
        processedAt:
          type: string
        processedBy:
          type: string
        failureReason:
          type: string
        dualControl:
          type: boolean
        releaseApproval:
          type: object
          properties:
            by:
              type: string
            at:
              type: string
            byId:
              type: string
          required: [by, at]
        counterpart:
          type: string
          enum: [deposit, grant, none]
          description: Card moves only - the other balance moved, or none
        note:
          type: string
          description: Staff card moves and balance adjustments - the reason shown to the applicant
        category:
          $ref: "#/components/schemas/AdjustmentCategory"
        source:
          $ref: "#/components/schemas/PayoutBalance"
        payoutDetails:
          type: array
          description: Withdrawals - the method's form as the applicant filled it in
          items:
            $ref: "#/components/schemas/PayoutDetail"
        payTo:
          type: array
          description: Deposits - the method's receiving details the applicant was given
          items:
            $ref: "#/components/schemas/ReceivingDetail"
        depositDetails:
          type: array
          description: Deposits - the method's form as the applicant filled it in
          items:
            $ref: "#/components/schemas/PayoutDetail"
        proofRequired:
          type: boolean
          description: Deposits - finance can't confirm until proof of payment is uploaded
        proof:
          type: array
          description: Deposits - the receipts or screenshots the applicant uploaded
          items:
            $ref: "#/components/schemas/DepositProof"
      required: [id, applicantId, type, description, amount, status, createdAt]
    ReceivingDetail:
      type: object
      properties:
        label:
          type: string
          maxLength: 100
        value:
          type: string
          maxLength: 400
      required: [label, value]
      additionalProperties: false
    DepositProof:
      type: object
      properties:
        id:
          type: string
        fileName:
          type: string
        contentType:
          type: string
        sizeBytes:
          type: number
        sha256:
          type: string
        uploadedAt:
          type: string
      required: [id, fileName, contentType, sizeBytes, sha256, uploadedAt]
    MethodFieldType:
      type: string
      enum: [text, textarea, email, number, select]
    MethodField:
      type: object
      properties:
        id:
          type: string
          maxLength: 40
          description: Omitted for a new field; kept on edits so remembered answers still match
        label:
          type: string
          maxLength: 100
        type:
          $ref: "#/components/schemas/MethodFieldType"
        required:
          type: boolean
        placeholder:
          type: string
          maxLength: 200
        help:
          type: string
          maxLength: 300
        options:
          type: array
          maxItems: 30
          items:
            type: string
            maxLength: 100
      required: [label, type, required, placeholder, help, options]
      additionalProperties: false
    WithdrawalMethodInput:
      type: object
      properties:
        name:
          type: string
          maxLength: 80
        enabled:
          type: boolean
          description: Shown to users on the withdrawal page
        min:
          type: number
        max:
          type: number
        feeRate:
          type: number
          description: 0-0.1 (a fraction of the amount)
        feeFixed:
          type: number
        feeCap:
          type: number
          description: The most a request is charged; 0 for no maximum
        processingTime:
          type: string
          maxLength: 100
        instructions:
          type: string
          maxLength: 2000
        photoUrl:
          type: string
          maxLength: 1000
          description: An https link, the method's current uploaded-photo path unchanged, or empty for the first-letter badge
        source:
          type: string
          enum: [grant, deposit, both]
        formTitle:
          type: string
          maxLength: 100
        fields:
          type: array
          maxItems: 20
          items:
            $ref: "#/components/schemas/MethodField"
      required: [name, enabled, min, max, feeRate, feeFixed, feeCap, processingTime, instructions, photoUrl, source, formTitle, fields]
      additionalProperties: false
    WithdrawalMethod:
      allOf:
        - $ref: "#/components/schemas/WithdrawalMethodInput"
        - type: object
          properties:
            id:
              $ref: "#/components/schemas/ChannelId"
            fields:
              type: array
              items:
                allOf:
                  - $ref: "#/components/schemas/MethodField"
                  - type: object
                    properties:
                      id:
                        type: string
                    required: [id]
          required: [id]
    WithdrawalMethodSave:
      type: object
      properties:
        version:
          type: string
          maxLength: 40
        method:
          $ref: "#/components/schemas/WithdrawalMethodInput"
      required: [version, method]
      additionalProperties: false
    DepositMethodInput:
      type: object
      properties:
        name:
          type: string
          maxLength: 80
        enabled:
          type: boolean
          description: Shown to users on the Add funds page
        min:
          type: number
        max:
          type: number
        feeRate:
          type: number
          description: 0-0.1 (a fraction of the amount), taken from what's credited
        feeFixed:
          type: number
        feeCap:
          type: number
          description: The most a deposit is charged; 0 for no maximum
        processingTime:
          type: string
          maxLength: 100
        instructions:
          type: string
          maxLength: 2000
        photoUrl:
          type: string
          maxLength: 1000
          description: An https link, the method's current uploaded-photo path unchanged, or empty for the first-letter badge
        receivingDetails:
          type: array
          description: Where applicants send the money (1-10 lines they can copy)
          maxItems: 20
          items:
            $ref: "#/components/schemas/ReceivingDetail"
        proof:
          type: string
          enum: [required, optional, off]
          description: Whether applicants upload proof of payment; required blocks confirmation until they do
        formTitle:
          type: string
          maxLength: 100
        fields:
          type: array
          maxItems: 20
          items:
            $ref: "#/components/schemas/MethodField"
      required: [name, enabled, min, max, feeRate, feeFixed, feeCap, processingTime, instructions, photoUrl, receivingDetails, proof, formTitle, fields]
      additionalProperties: false
    DepositMethod:
      allOf:
        - $ref: "#/components/schemas/DepositMethodInput"
        - type: object
          properties:
            id:
              $ref: "#/components/schemas/ChannelId"
            fields:
              type: array
              items:
                allOf:
                  - $ref: "#/components/schemas/MethodField"
                  - type: object
                    properties:
                      id:
                        type: string
                    required: [id]
          required: [id]
    DepositMethodSave:
      type: object
      properties:
        version:
          type: string
          maxLength: 40
        method:
          $ref: "#/components/schemas/DepositMethodInput"
      required: [version, method]
      additionalProperties: false
    MethodAvailability:
      type: object
      properties:
        enabled:
          type: boolean
      required: [enabled]
      additionalProperties: false
    TreasuryInput:
      type: object
      description: Money settings as finance edits them on Settings - Money; withdrawal and deposit methods (with their limits) have their own endpoints
      properties:
        physicalCardFee:
          type: number
        cardDeliveryFee:
          type: number
        depositThreshold:
          type: number
        highValueDeposit:
          type: number
        dualControlThreshold:
          type: number
        depositDualControlThreshold:
          type: number
          description: Deposits at or above this need a second staff member's approval before confirming; 0 for never
      required: [physicalCardFee, cardDeliveryFee, depositThreshold, highValueDeposit, dualControlThreshold, depositDualControlThreshold]
      additionalProperties: false
    Treasury:
      allOf:
        - $ref: "#/components/schemas/TreasuryInput"
        - type: object
          properties:
            channels:
              type: array
              description: Withdrawal methods; applicants get only the available ones
              items:
                $ref: "#/components/schemas/WithdrawalMethod"
            depositMethods:
              type: array
              description: Deposit methods; applicants get only the available ones
              items:
                $ref: "#/components/schemas/DepositMethod"
            updatedAt:
              type: string
            changeLog:
              type: array
              description: Staff only; empty for applicants
              items:
                $ref: "#/components/schemas/ProgramChange"
          required: [channels, depositMethods, updatedAt, changeLog]
    Lockdown:
      type: object
      properties:
        since:
          type: string
        by:
          type: string
        reason:
          type: string
      required: [since, by, reason]
    MoneySettings:
      type: object
      properties:
        treasury:
          $ref: "#/components/schemas/Treasury"
        lockdown:
          allOf:
            - $ref: "#/components/schemas/Lockdown"
          nullable: true
      required: [treasury, lockdown]
    MoneySettingsResult:
      type: object
      properties:
        settings:
          $ref: "#/components/schemas/MoneySettings"
        message:
          type: string
        id:
          type: string
          description: The withdrawal or deposit method the action created or changed, if any
      required: [settings, message]
    MoneySettingsUpdate:
      type: object
      properties:
        version:
          type: string
          maxLength: 40
        treasury:
          $ref: "#/components/schemas/TreasuryInput"
      required: [version, treasury]
      additionalProperties: false
    Cards:
      type: object
      properties:
        virtual:
