# nginx site. Install: cp deploy/nginx-novabridgegrant.conf /etc/nginx/sites-available/novabridgegrant
# The API port (3100) must match PORT in /etc/novabridgegrant/api.env.
# HTTP only; `certbot --nginx -d access.novabridgegrant.org` adds the HTTPS block to the installed copy.
server {
    listen 80;
    listen [::]:80;
    server_name access.novabridgegrant.org;

    root /var/www/novabridgegrant/artifacts/grant-user-portal/dist/public;
    index index.html;

    client_max_body_size 25m;

    location /api/ {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
